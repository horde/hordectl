name: Install Integration Test

on:
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  install-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PHP 8.4 and prerequisites
        run: |
          set -ex

          # Add PHP PPA
          sudo add-apt-repository ppa:ondrej/php -y
          sudo apt update

          # Install PHP 8.4 with required extensions
          sudo apt install -y \
            php8.4 \
            php8.4-cli \
            php8.4-fpm \
            php8.4-mysql \
            php8.4-xml \
            php8.4-mbstring \
            php8.4-curl \
            php8.4-gd \
            php8.4-intl \
            php8.4-bcmath \
            php8.4-zip \
            mysql-server \
            apache2 \
            composer

          # Verify installations
          php -v
          composer --version
          apache2 -v

      - name: Configure MySQL database
        run: |
          set -ex

          # Stop MySQL
          sudo systemctl stop mysql

          # Recreate data directory with correct permissions
          sudo rm -rf /var/lib/mysql
          sudo mkdir -p /var/lib/mysql
          sudo chown -R mysql:mysql /var/lib/mysql
          sudo chmod 750 /var/lib/mysql

          # Initialize MySQL
          sudo mysqld --initialize-insecure --user=mysql --datadir=/var/lib/mysql

          # Start MySQL
          sudo systemctl start mysql
          sleep 5

          # Create test database
          sudo mysql -u root << 'EOF'
          CREATE DATABASE horde_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER 'horde'@'localhost' IDENTIFIED BY 'test123';
          GRANT ALL PRIVILEGES ON horde_test.* TO 'horde'@'localhost';
          FLUSH PRIVILEGES;
          EOF

          # Verify
          sudo mysql -u root -e "SHOW DATABASES LIKE 'horde_test';"

      - name: Install hordectl dependencies
        run: |
          set -ex

          # Set minimum-stability to dev for alpha/dev Horde packages
          composer config minimum-stability dev
          composer config prefer-stable true

          composer install --no-dev --no-interaction --prefer-dist

      - name: Run hordectl install
        run: |
          set -ex

          # Run install as root to avoid permission issues
          sudo ./bin/hordectl install --install-dir=/var/www/horde --stability=dev

          # Set ownership and permissions for Apache
          sudo chown -R www-data:www-data /var/www/horde
          sudo chmod -R 755 /var/www/horde

          # Ensure var directories are writable by Apache
          sudo chmod -R 775 /var/www/horde/var

          # Verify installation structure
          test -f /var/www/horde/composer.json || exit 1
          test -d /var/www/horde/vendor || exit 1
          test -d /var/www/horde/vendor/horde || exit 1
          test -d /var/www/horde/web || exit 1
          test -f /var/www/horde/web/index.php || exit 1

          echo "✅ Installation directory structure validated"

      - name: Generate Apache vhost via webserver-config
        run: |
          set -ex

          # Dogfood: the vhost that Apache loads comes from hordectl
          # itself, not from a hand-maintained fixture. Tier-3
          # synthesis (--default-url + --root-bundle-path) is right
          # here because the target's live registry isn't reachable
          # yet — hordectl has extracted the bundle but Apache isn't
          # up.
          #
          # The bundle's shipped registry places horde at /horde/ and
          # every other app at /<app>/. No --app-webroots overrides:
          # matching the shipped layout keeps rampage's route table
          # consistent with what the URLs actually resolve to.
          sudo mkdir -p /var/www/horde/var/webserver
          sudo ./bin/hordectl webserver-config apache-vhost \
            --default-url=http://localhost \
            --root-bundle-path=/var/www/horde \
            --output-dir=/var/www/horde/var/webserver/apache-vhost \
            --force

          # For a vanilla single-vhost install the DocumentRoot is
          # the bundle's web/ directory (which holds web/horde/,
          # web/imp/, web/static/, ...). The generator emits a
          # commented-out placeholder when no app is root-anchored;
          # swap that for the real bundle web root so /horde/*,
          # /imp/*, /static/*, ... all resolve.
          sudo sed -i \
            's|# DocumentRoot /var/www/html|DocumentRoot /var/www/horde/web|' \
            /var/www/horde/var/webserver/apache-vhost/sites/localhost.conf

      - name: Configure Apache web server
        run: |
          set -ex

          # Start PHP-FPM
          sudo systemctl start php8.4-fpm
          sudo systemctl enable php8.4-fpm

          # Enable required modules
          sudo a2enmod rewrite
          sudo a2enmod proxy_fcgi
          sudo a2enmod setenvif

          # Drop the hordectl-generated tree into place. sites/ files
          # go into sites-available; horde-includes/ goes under
          # ServerRoot so the vhost's absolute Include lines resolve.
          sudo cp -r /var/www/horde/var/webserver/apache-vhost/horde-includes /etc/apache2/
          sudo cp /var/www/horde/var/webserver/apache-vhost/sites/localhost.conf /etc/apache2/sites-available/horde.conf

          # Enable site
          sudo a2dissite 000-default
          sudo a2ensite horde

          # Sanity check the generated config before we reload.
          sudo apachectl configtest

          # Restart Apache to apply all changes
          sudo systemctl restart apache2

          # Verify services are running
          sudo systemctl status php8.4-fpm --no-pager
          sudo systemctl status apache2 --no-pager

      - name: Verify target was auto-created
        run: |
          set -ex

          # Check that install command created the target
          sudo ./bin/hordectl target current | grep "horde" || exit 1

          echo "✅ Target auto-created by install command"

      - name: Activate Horde installation
        run: |
          set -ex

          sudo ./bin/hordectl activate
          sudo chown -R www-data:www-data /var/www/horde/var

      - name: Configure database connection
        run: |
          set -ex

          sudo ./bin/hordectl configure database \
            --type=mysql \
            --host=localhost \
            --port=3306 \
            --username=horde \
            --password=test123 \
            --database=horde_test \
            --charset=utf8mb4

      - name: Configure session handler
        run: |
          set -ex

          sudo ./bin/hordectl configure session \
            --cookie-domain='' --type=builtin \
            --ensure-session-secret

      - name: Configure authentication
        run: |
          set -ex

          sudo ./bin/hordectl configure auth --driver=sql --encryption=ssha

          sudo -u www-data /var/www/horde/vendor/bin/horde-db-migrate up

      - name: Configure admin secret for API
        run: |
          set -ex

          sudo ./bin/hordectl target update horde --endpoint=http://localhost/horde
          # `secret generate` produces a cryptographically random 128-char
          # secret via ConfigFileWriter::generateSecret() and syncs it to
          # both /var/www/horde/var/config/horde/conf.php and the local
          # target config, so this is already a fresh per-CI-run secret.
          # No fixed keys anywhere in this workflow.
          sudo ./bin/hordectl secret generate

      - name: Verify admin API readiness
        run: |
          set -ex

          # Locate the target config file. `sudo` under GitHub Actions
          # preserves $HOME from the invoking user by default, so the
          # file may land under /home/runner/ rather than /root/.
          # Check both.
          CONFIG=""
          for candidate in /root/.config/horde/hordectl.php /home/runner/.config/horde/hordectl.php; do
            if sudo test -f "$candidate"; then
              CONFIG="$candidate"
              break
            fi
          done
          if [ -z "$CONFIG" ]; then
            echo "❌ hordectl target config not found in either $HOME location"
            sudo find / -name hordectl.php 2>/dev/null | head
            exit 1
          fi
          echo "Using target config: $CONFIG"

          # Extract the freshly-generated secret. The file is a PHP-array
          # export, so we ask PHP to load it rather than regex-parsing.
          SECRET=$(sudo php -r "
            \$c = require '$CONFIG';
            \$current = \$c['current-target'] ?? '';
            \$t = \$c['targets'][\$current] ?? [];
            echo \$t['admin_secret'] ?? '';
          ")
          if [ -z "$SECRET" ]; then
            echo "❌ Could not extract admin_secret from target config"
            sudo ls -la "$(dirname "$CONFIG")" || true
            exit 1
          fi
          echo "::add-mask::$SECRET"
          # Save for later steps so they don't have to re-locate.
          echo "HORDECTL_CONFIG=$CONFIG" >> "$GITHUB_ENV"

          # Hit the readiness route directly with curl. The bundle's
          # shipped registry places horde at /horde/, so the admin
          # routes live at /horde/api/v1/admin/*. Retries handle the
          # small window between secret write and Apache picking up
          # the config change.
          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl -sS -o /tmp/info.json -w '%{http_code}' \
              -H "Authorization: Bearer $SECRET" \
              http://localhost/horde/api/v1/admin/info || echo "curl-failed")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ /horde/api/v1/admin/info returned 200 on attempt $attempt"
              break
            fi
            echo "  attempt $attempt: HTTP $HTTP_CODE"
            if [ "$attempt" = "5" ]; then
              echo "❌ /horde/api/v1/admin/info never became ready"
              cat /tmp/info.json || true
              exit 1
            fi
            sleep 2
          done

          # Sanity check: response should carry the version field.
          grep -q '"version"' /tmp/info.json || {
            echo "❌ /horde/api/v1/admin/info response missing version field"
            cat /tmp/info.json
            exit 1
          }
          echo "✅ Readiness route responded with expected shape"

      - name: Create test user
        run: |
          set -ex

          sudo ./bin/hordectl create user --username=administrator --password=admin123

      - name: Exercise admin API through hordectl
        run: |
          set -ex

          # Each of these queries goes through the admin API (Bearer
          # auth). Failure here means the API endpoint, auth, or the
          # command's request wiring is broken.
          echo "--- query apps ---"
          sudo ./bin/hordectl query apps | head -30

          echo "--- query registry (head) ---"
          sudo ./bin/hordectl query registry | head -30

          echo "--- query user administrator ---"
          sudo ./bin/hordectl query user administrator | head -20

          echo "--- query group ---"
          sudo ./bin/hordectl query group | head -20 || echo "no groups yet"

          echo "✅ Admin API round-trips succeeded"

      - name: Run subsystem tests
        run: |
          set -ex

          # `test all` exercises every subsystem (db, cache, session,
          # logger, auth, jwt) in one call. Replaces the earlier ad-hoc
          # per-subsystem invocations.
          sudo ./bin/hordectl test all

      - name: Smoke-test the new subcommands
        run: |
          set -ex

          # Every subcommand added since the previous CI cut is
          # touched at least once so we notice regressions in the
          # basic invocation path.

          echo "--- translation binaries ---"
          sudo ./bin/hordectl translation binaries

          echo "--- webserver-config apache-vhost from live registry ---"
          sudo mkdir -p /var/www/horde/var/webserver-ci
          sudo ./bin/hordectl webserver-config apache-vhost \
            --output-dir=/var/www/horde/var/webserver-ci/apache

          # Confirm the expected tree took shape.
          test -f /var/www/horde/var/webserver-ci/apache/README.md || {
            echo "❌ webserver-config did not emit README.md"
            exit 1
          }
          test -d /var/www/horde/var/webserver-ci/apache/sites || exit 1
          test -d /var/www/horde/var/webserver-ci/apache/horde-includes/apps || exit 1
          echo "✅ webserver-config wrote sites/ + horde-includes/ tree"

          echo "--- webserver-config nginx from vanilla defaults ---"
          sudo ./bin/hordectl webserver-config nginx \
            --default-url=http://localhost \
            --root-bundle-path=/var/www/horde \
            --output-dir=/var/www/horde/var/webserver-ci/nginx

          test -f /var/www/horde/var/webserver-ci/nginx/README.md || exit 1
          # Reproducer command must appear in the README's provenance
          # block — this is our regression guard for the tier-aware
          # readme rendering.
          sudo grep -q "hordectl webserver-config nginx --default-url=http://localhost" \
            /var/www/horde/var/webserver-ci/nginx/README.md || {
              echo "❌ nginx README did not carry the reproducer command"
              sudo cat /var/www/horde/var/webserver-ci/nginx/README.md | head -50
              exit 1
            }
          echo "✅ nginx provenance carries the correct reproducer"

          echo "--- webserver-config apache-vhost: live registry + --default-url override ---"
          # Mix-and-match tier: fetch the real registry, anchor every
          # relative webroot at http://localhost. Proves the tier-1
          # path threads through applyOverrides() correctly.
          sudo ./bin/hordectl webserver-config apache-vhost \
            --default-url=http://localhost \
            --output-dir=/var/www/horde/var/webserver-ci/apache-anchored \
            --force

          # After anchoring, horde's webroot should be
          # http://localhost/horde/ (registry says /horde/, anchor adds
          # scheme+host). Grep an app snippet to confirm the promotion.
          sudo grep -q '^# Webroot: http://localhost' \
            /var/www/horde/var/webserver-ci/apache-anchored/horde-includes/apps/horde.conf || {
              echo "❌ live-registry + --default-url did not anchor webroots"
              sudo head -25 /var/www/horde/var/webserver-ci/apache-anchored/horde-includes/apps/horde.conf
              exit 1
            }
          # Provenance banner must still say "live registry" — the
          # override doesn't change which tier resolved the base map.
          sudo grep -q 'reading the installation.*live' \
            /var/www/horde/var/webserver-ci/apache-anchored/README.md || {
              echo "❌ anchored README did not identify as live-registry tier"
              exit 1
            }
          # Reproducer must include the --default-url override.
          sudo grep -qF -- '--default-url=http://localhost' \
            /var/www/horde/var/webserver-ci/apache-anchored/README.md || {
              echo "❌ anchored README missing --default-url in reproducer"
              exit 1
            }
          echo "✅ live-registry + --default-url override threaded through"

      - name: Verify web accessibility
        run: |
          set -ex

          # Test Apache is serving the site
          curl -f http://localhost/ || exit 1

          # Check for Horde in response
          curl -s http://localhost/ | grep -i "horde" || echo "⚠️  Horde string not found in response"

          echo "✅ Web server responding"

      - name: Upload logs on failure
        if: failure()
        run: |
          set +e
          echo "=== Apache Error Log ==="
          sudo cat /var/log/apache2/horde-test-error.log
          echo ""
          echo "=== Apache Access Log ==="
          sudo cat /var/log/apache2/horde-test-access.log
          echo ""
          echo "=== PHP Error Log ==="
          sudo cat /var/log/php8.4-fpm.log || echo "No FPM log"
          echo ""
          echo "=== Horde Config ==="
          sudo cat /var/www/horde/var/config/horde/conf.php || echo "No conf.php"
          echo ""
          echo "=== Readiness curl payload (if captured) ==="
          sudo cat /tmp/info.json 2>/dev/null || echo "no /tmp/info.json"
          echo ""
          echo "=== hordectl target current ==="
          sudo ./bin/hordectl target current || echo "target current failed"
          echo ""
          echo "=== hordectl target config (masked) ==="
          # Mask the admin_secret before dumping so a failure log
          # cannot leak the fresh CI-session token. HORDECTL_CONFIG is
          # set by the "Verify admin API readiness" step; when the
          # failure happened earlier, fall back to a filesystem search.
          CONFIG="${HORDECTL_CONFIG:-}"
          if [ -z "$CONFIG" ] || ! sudo test -f "$CONFIG"; then
            CONFIG=$(sudo find /root /home/runner -name hordectl.php 2>/dev/null | head -1)
          fi
          if [ -n "$CONFIG" ] && sudo test -f "$CONFIG"; then
            sudo php -r "
              \$c = @require '$CONFIG';
              if (!is_array(\$c)) { echo '(no target config)' . PHP_EOL; exit; }
              foreach ((\$c['targets'] ?? []) as \$name => \$t) {
                if (isset(\$t['admin_secret']) && \$t['admin_secret'] !== '') {
                  \$t['admin_secret'] = '(masked)';
                }
                echo \$name . ': ' . json_encode(\$t, JSON_PRETTY_PRINT) . PHP_EOL;
              }
            " || echo "config dump failed"
          else
            echo "(no target config found)"
          fi
          echo ""
          echo "=== webserver-config trees (if generated) ==="
          sudo ls -la /var/www/horde/var/webserver-ci/apache/ 2>/dev/null || echo "no apache tree"
          sudo ls -la /var/www/horde/var/webserver-ci/nginx/ 2>/dev/null || echo "no nginx tree"
